<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .background {
      fill: #000000;
    }

    .text {
      fill: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      .background {
        fill: #ffffff;
      }

      .text {
        fill: #000000;
      }
    }
  </style>

  <rect
    class="background"
    width="64"
    height="64"
    rx="14"
  />

  <text
    class="text"
    x="32"
    y="40"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="26"
    font-weight="700"
  >
    SF
  </text>
</svg>
